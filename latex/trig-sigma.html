<h1>Trig Function Sigma Notation</h1>
<hr>
<p>
<script type="math/tex; mode=display">
sin(x) = \Sigma_{n=0}^{\infty}
\begin{bmatrix}
\frac{\alpha} {\Delta}
\end{bmatrix} \kappa
</script>
<script type="math/tex; mode=display"> \alpha = (-1)^n </script>
<script type="math/tex; mode=display"> \Delta = (2n - 1)! </script>
<script type="math/tex; mode=display"> \kappa = x^{2n+1} </script>
</p>
<hr>
<p>
<script type="math/tex; mode=display">
cos(x) = \Sigma_{n=0}^{\infty}
\begin{bmatrix}
\frac{\alpha} {\Delta}
\end{bmatrix} \kappa
</script>
<script type="math/tex; mode=display"> \alpha = (-1)^n </script>
<script type="math/tex; mode=display"> \Delta = (2n)! </script>
<script type="math/tex; mode=display"> \kappa = x^{2n} </script>
</p>
