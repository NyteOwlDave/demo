<script>
function _plot( fn, lo, hi, steps ) {
    const gfx = plot . graphics();

    fn = ( fn || _fn[ 0 ] );
    lo = ( lo || 0   );
    hi = ( hi || 800 );
    const gap = ( hi - lo );

    steps     = ( steps || ( gap / 3 ) );
    const dx  = ( gap / steps );

    plot . clear( gfx );

    gfx . lineWidth   = dx * 0.9;
    gfx . strokeStyle = "mintcream";
    for ( let x = lo; x < hi; x += dx ) {
        let y = fn( x );
        plot.vline( x, y, gfx );
    };
}
</script>

<!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->

<script>
plot.graphics = function() {
    if ( null === srf ) {
        srf = gid( "surface" );
        srf . width  = 800;
        srf . height = 600;
    }
    gfx = srf . getContext( "2d" );
    gfx . strokeStyle = ( gfx . strokeStyle || "mintcream" );
    return ( gfx );
};
</script>

<!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->

<script>
plot.clear = function( gfx ) {
    const srf = gfx.canvas;
    const w = srf . width;
    const h = srf . height;
    gfx . clearRect( 0, 0, w, h );
    return ( gfx );
}
</script>

<!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->

<script>
plot.vline = function( x, y, gfx ) {
    const kx = plot . xscale;
    const ky = plot . yscale;
    const xo = plot . xctr;
    const yo = plot . yctr;
    y *= ky;
    x = xo + x * kx;
    console.debug( { x, y } );
    gfx = ( gfx || plot.graphics() );
    gfx . beginPath();
    gfx . moveTo( x, yo     );
    gfx . lineTo( x, yo - y );
    gfx . stroke();
};
</script>
