<script>
function ShowPalette( colors ) {
    const C_GOLD = _RGB( 255, 215, 20 );
    const columns = Ceiling( Sqrt( colors.length ) );
    for ( let i = 0; i < colors.length; i += 1 ) {
        const row = Floor( i / columns );
        const col = ( i % columns );
        const x = 20 + col * 36;
        const y = 20 + row * 36;
        FillRect( x, y, 28, 28, colors[ i ] );
        DrawRect( x-2, y-2, 32, 32, C_GOLD );
    }
}
</script>

<script>
function DrawProgress( y, ratio ) {
    const C_GOLD = _RGB( 255, 215, 20 );
    const C_NAVY = _RGB(  20,  20, 64 );
        const sz = Screen.size();
        const w = sz.w;
        const h = sz.h;
        let margin = 16;
        let wc = w - 2 * margin;
        let hc = 32;
        let x  = margin;
        y = h - ( y + hc + margin );
        if ( ratio > 0 ) {
            let dx = Median( Floor( ratio * wc ), 0, wc );
            FillRect( x, y, dx, hc, C_GOLD );
        } else {
            FillRect( x, y, wc, hc, C_NAVY );
        }
        DrawRect( x-2, y-2, wc + 4, hc + 4, C_GOLD );
}
</script>

<script>
function UpdateProgress( rx=0, ry=0 ) {
    DrawProgress(  2, rx );
    DrawProgress( 42, ry );
}
</script>

<script>
function tracer_test() {
    if ( main.stop ) {
            tracer_test.stop();
            return;
    }
    if ( ty >= SH ) { return; }
    if ( tx >= SW ) {
            ty += 1;
            tx = 0;
    }
    const rx = tx / SW;
    const ry = ty / SH;
    UpdateProgress( rx, ry );
    tx += 1;
}
; tx = 0
; ty = 0
tracer_test.reset = function() {
    tx = 0;
    ty = 0;
    UpdateProgress();
}
tracer_test.start = function() {
    tracer_test.stop();
    tracer_test.reset();
    main.stop = false;
    main.timer = setInterval( tracer_test, 1 );
}
tracer_test.stop = function() {
    main.stop = true;
    let id = main.timer;
    if ( id === null ) { return; }
    clearInterval( id );
    main.timer = null;
}
</script>
