<!DOCTYPE HTML>

<html>

<head>
<meta charset="utf-8"/>
<title>Explosion</title>
<style>
canvas {
	position: absolute;
	left: 0;
	top: 0;
	background-color: black;
	border: 1px solid gold;
}
</style>
</head>

<body>

<main>
<canvas id="idCanvas" width="100" height="100"></canvas>
</main>

<footer id="idFooter" style="margin-top: 120px">
<div id="messages">Please wait while the explosion is being generated...</div>
</footer>

<application>
<script src="./explosion.js"></script>
<script src="./fire-palette.js"></script>
<script>
let frame = -1
function draw() {
	if (frame<0) return
	if (frame>=Sprites.EXPLODE_FRAMES) frame=0
	const pal = htmlFirePalette.color
	Sprites.drawFrame(idCanvas, frame++, 10, 10, pal)
}
function exec() {
	Sprites.createFrames()
	Sprites.createExplosions()
	messages.textContent = 'Enjoy!';
	frame = 0
	window.setInterval(draw,20)
}
window.addEventListener('load',exec)
</script>
</application>

</body>

</html>
