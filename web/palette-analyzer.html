<script>
function rgba_from_hex( s ) {
    s = str( s ).slice( 1 );
    const n = parseInt( `0x${s}` );
    const a = ( n >> 24 ) & 0xFF;
    const r = ( n >> 16 ) & 0xFF;
    const g = ( n >>  8 ) & 0xFF;
    const b = ( n       ) & 0xFF;
    return { r, g, b, a };
}
</script>

<script>
function prepare_rgba_colors() {
    colors_rgba = colors_hex.map( rgba_from_hex );
}
</script>

<script>
function macro( cmd ) {
    const ops = macro;
    try {
        ops . error = "";
        ops . input = cmd;
        const p = cmd.split( " " );
        if (! p.length ) { return true; }
        const t = p.shift();
        const v = p.join( " " );
        switch ( t ) {
        case "?" : return _help( v );
        default  : return ( false  );

        function _help( rex ) {
            inspect( "Global Members", seeker( rex ) );
            return ( true );
        }
    } catch ( e ) {
        ops.error   = ( e );
        console.error ( e );
    }
    return ( false );
}
</script>

crnd =( k )=> ( (k=k||1), rnd( k ) - (0.5 * k) );

<script id="stats.js">

vmax =( v )=> v.reduce((a,b)=>max(a,b),-Infinity);
vmin =( v )=> v.reduce((a,b)=>min(a,b),+Infinity);
vsum =( v )=> v.reduce((a,b)=>(a+b),0);
vavg =( v )=> (vsum(v)/(v.length));

vbounds = function( v ) {
    let lo = +Infinity;
    let hi = -Infinity;
    v.forEach(
        ( n ) => {
            lo = min( n, lo );
            hi = max( n, hi );
        }
    );
    return { lower : lo, upper : hi };
};

vmedian = function( v ) {
    let i, j;
    if (! v.length ) { return NaN; }
    v = v.vsort();
    if ( v.length % 1 ) {
        i = ceil( v.length / 2 );
        return v[ i ];
    } else {
        i = floor( v.length / 2 );
        j = i + 1;
        return ( 0.5 * ( v[i] + v[j] ) );
    }
};

vlerp = function( v, t ) {
    const bounds = vbounds( v );
    const lo = bounds.lower;
    const hi = bounds.upper;
    const u = ( 1 - t );
    return ( u*lo + t*hi );
};

vhalf =( v )=> vlerp( v, 0.5 );

vrange = function( v ) {
    const bounds = vbounds( v );
    return ( bounds.upper - bounds.lower );
};

vmse = function( v ) {
    const k = ( v.length - 1 );
    if ( k < 0 ) {
        return NaN;
    }
    if ( k < 1 ) {
        return 0;
    }
    const mean = vavg( v );
    let err = 0;
    v.forEach(
        ( x ) => {
            dx = x - mean;
            err += square( dx );
        }
    );
    return ( err / k );
};

vstd =( v )=> sqrt( vmse( v ) );

vnorm = function( v ) {
    const bounds = vbounds( v );
    const range  = ( bounds.upper - bounds.lower );
    const scale  = 1 / range;
    const samples = v.map( n => n * scale );
    return { samples, bounds, range, scale };
};

vstats = function( v ) {
    v = ( v || [] );
    const n = v.length;
    let lo = +Infinity;
    let hi = -Infinity;
    let xx = 0; let xsum = 0;
    let yy = 0; let ysum = 0;
    let xy = 0;
    let x = 0;
    v.forEach(
        ( y ) => {
            xsum += x;
            ysum += y;
            xx += square( x );
            yy += square( y );
            xy += ( x * y );
            lo = min( y, lo );
            hi = max( y, hi );
            x += 1;
        }
    );
    const m = ((n*xy)-(xsum*ysum)) / ((n*xx)-square(xsum));
    const b = ((ysum*xx)-(xsum*xy)) / ((n*xx)-square(xsum));
    const avg = ysum / n;
    const sse = vsum(
        v.map(
            ( y ) => square( y-avg )
        )
    );
    const mse = sse / ( n - 1 );
    const std = sqrt( mse );
    return {
        n, avg,
        m, b,
        lo, hi,
        xsum, ysum,
        xx, yy, xy,
        sse, mse, std,
        samples : v
    };
};

vstats.hints = {
  n    : "Sample Count"
, avg  : "Mean Average"
, m    : "Slope"
, b    : "Intercept"
, lo   : "Lower Y Bound"
, hi   : "Upper Y Bound"
, xsum : "Sum of X Indices"
, ysum : "Sum of Y Samples"
, xx   : "Sum of Squares of Indices"
, yy   : "Sum of Squares of Samples"
, xy   : "Sum of X-Y Products"
, sse  : "Sum of Squared Errors"
, mse  : "Mean Squared Error"
, std  : "Standard Deviation"
, samples : "Sample Set"
};

vstats.pubs = ( "http://dave-probook/std/pubs/math/" );

vstats.tabulate = function( o ) {
    if ( Array.isArray( o ) ) {
        return ( o );
    }
    if (! ( o instanceof Object ) ) {
        o = vstats.hints;
    }
    const m = Object.keys( o );
    return m.map( k => ( [ k, o[ k ] ] ) );
};

vstats.inspect = function( o ) {
    const t = vstats.tabulate( o );
    inspect( "Statistics", t );
};

</script>

<script id="madge.js">

function Surface() {
    const ops = Surface;
    const srf = surface;
    const rc = srf.getBoundingClientRect();
    let w = parseInt( rc.width  );
    let h = parseInt( rc.height );
    if ( ops.debug ) {
        inspect_size( `Viewport`, w, h );
    }
    if ( srf.width !== w ) {
        srf.width = w;
    }
    if ( srf.height !== h ) {
        srf.height = h;
    }
    w = srf.width;
    h = srf.height;
    if ( ops.debug ) {
        inspect_size( `Surface`, w, h );
    }
    return ( srf );
}

Surface.debug = ( false );

function Graphics() {
    return (
        Surface().getContext( "2d" )
    );
};

function Background( style ) {
    const srf = Surface();
    const gfx = Graphics();
    const w = srf.width;
    const h = srf.height;
    gfx.fillStyle = ( style || gfx.fillStyle );
    gfx.fillRect( 0, 0, w, h );
}

function Pen( style ) {
    Graphics().strokeStyle = ( style );
}

Pen.thickness = function( n ) {
    n = ( parseInt( n ) || 1 );
    Graphics().strokeWidth = ( n );
};

function Palette() {
    return colors_rgba;
}

Palette.from_hex = function( source ) {
    colors_rgba = source.map( rgba_from_hex );
};

function Color( index ) {
    return ( Palette() [ index ] );
}

Color.from_hex = function( source ) {
    return rgba_from_hex( source );
};

</script>

    colors = ( colors || Palette() );
    const v = grn_norm( colors ).samples;
    Pen( "green" );
    plot_vec( v, y, yScale );
}

function plot_blu( colors, y=266, yScale=256 ) {
    colors = ( colors || Palette() );
    const v = blu_norm( colors ).samples;
    Pen( "blue" );
    plot_vec( v, y, yScale );
}

function plot_rgb( colors, yScale=128 ) {
    colors = ( colors || Palette() );
    const k = ( yScale || 128 );
    const h = ( 10 + k );
    Background( "black" );
    plot_red( colors, h * 1, 128 );
    plot_grn( colors, h * 2, 128 );
    plot_blu( colors, h * 3, 128 );
}

function plot( x, dx, count, cb ) {
    const gfx = Graphics();
    Pen.thickness( 1 );
    let u=0;
    while ( count-- > 0 ) {
        const y = cb( x );
        x += dx;
        let p = round( yAxis + u ); u += 1;
        let q = round( xAxis - y * scale );
        gfx.beginPath();
        gfx.moveTo( p, xAxis );
        gfx.lineTo( p, q );
        gfx.stroke();
    }
}

function draw_axes( xo, yo, w, ha, hb ) {
    const gfx = Graphics();
    Pen( "white" );
    Pen.thickness( 2 );
    const ya = yo - ha;
    const yb = yo + hb;
    gfx.beginPath();
    gfx.moveTo( xo     , yo );
    gfx.lineTo( xo + w , yo );
    gfx.stroke();
    gfx.beginPath();
    gfx.moveTo( xo , ya );
    gfx.lineTo( xo , yb );
    gfx.stroke();
}

function draw_axes_positive( xo, yo, w, h ) {
    draw_axes( xo, yo, w, h, 0 )
}

function draw_axes_negative( xo, yo, w, h ) {
    draw_axes( xo, yo, w, 0, h )
}

crunch.decode = function( sender ) {
    const k = sender.textContent.trim();
    switch( k ) {
    case "🏍️" : return "run()";
    case "🧼" : return "Background()";
    case "🏠" : return "home()";
    case "🗒️" : return "notes()";
    case "📟" : return "jax()";
    case "👥" : return "macro('?')";
    }
    throw new Error( "Unknown Action : " + k );
};

crunch.init = function() {
    const m = all( "BUTTON" );
    function init( btn ) {
        const k = btn.textContent.trim();
        switch( k ) {
        case "🏍️" : return _run();
        case "🧼" : return _bgnd();
        case "🏠" : return _home();
        case "🗒️" : return _notes();
        case "📟" : return _jax();
        case "👥" : return _help();
        }
        function _run() {
            btn.title = "🏍️ Run Script";
        }
        function _bgnd() {
            btn.title = "🧼 Erase Background";
        }
        function _home() {
            btn.title = "🏠 View in Browser";
        }
        function _notes() {
            btn.title = "🗒️ Palette Analyzer Notes";
        }
        function _jax() {
            btn.title = "📟 Math Jax Editor";
        }
        function _help() {
            btn.title = "👥 Inspect Globals";
        }
        console.warn( `Ignoring Button:`, k );
    }
    m.forEach( init );
};
