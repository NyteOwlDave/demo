<script id="perform.js">

<script id="exec.js">
function exec( js ) {
    const ops = exec;
    try {
        const cmd = str( js );
        if ( macro( cmd ) ) { return; }
        ops.prior  = String( ops.input || "" );
        ops.input  = String( js );
        ops.output = window.eval( ops.input );
        ops.error = "";
    } catch ( e ) {
        ops.output  = "";
        ops.error   = ( e );
        console.error ( e );
    }
}
;

</script>

<script id="macro.js">
function macro( cmd ) {
    const ops = macro;
    try {
        ops . error = "";
        ops . input = cmd;
        const p = cmd.split( " " );
        if (! p.length ) { return true; }
        const t = p.shift();
        const v = p.join( " " );
        switch ( t ) {
        case "?" : return _help( v );
        default  : return ( false  );
        }
        function _help( rex ) {
            inspect( "Global Members", seeker( rex ) );
            return ( true );
        }
    } catch ( e ) {
        ops.error   = ( e );
        console.error ( e );
    }
    return ( false );
}
</script>

<script id="inspect.js">

function inspect( title, t ) {
    const ops = inspect;
    t = ops.tabulate( t );
    const c = console;
    c.groupCollapsed( title || "Untitled" );
    c.table( t );
    c.groupEnd();
}

inspect.size = function( title, w, h ) {
    const t = [
        ( `Width : ${w}`  )
      , ( `Height : ${h}` )
    ];
    inspect( title, t );
};

inspect.tabulate = function( o ) {
    if ( o instanceof Object ) {
        if ( Array.isArray( o ) ) {
            return ( o );
        }
        return Object.keys( o ).sort();
    }
    return [ String( o ) ];
};

inspect.scripts = function( rex ) {
    const q = "SCRIPT[id]";
    let m = all( q ).map( ( o ) => o.id );
    if ( rex = str( rex ) ) {
        m = m.filter( k => ( rex.test( k ) ) );
    }
    inspect( "Scripts", m );
};

</script>

<script id="crunch.js">

function crunch( event ) {
    try {
        const js = crunch.decode( event.target );
        console.log( js );
        window.eval( js );
    } catch ( e ) {
        crashed ( e );
    }
}

crunch.decode = function( sender ) {
    const k = sender.textContent.trim();
    switch( k ) {
    case "🏍️" : return "run()";
    case "🧼" : return "Background()";
    case "💠" : return "zoom(sce)";
    case "🗒️" : return "notes()";
    case "👥" : return "macro('?')";
    case "📟" : return "jax()";
    case "🚀" : return "dot.ide()";
    case "🏠" : return "home()";
    }
    throw new Error( "Unknown Action : " + k );
};

crunch.init = function() {
    const m = all( "BUTTON" );
    function init( btn ) {
        const k = btn.textContent.trim();
        switch( k ) {
        case "🏍️" : return _run();
        case "🧼" : return _bgnd();
        case "💠" : return _zoom();
        case "🏠" : return _home();
        case "🗒️" : return _notes();
        case "📟" : return _jax();
        case "🚀" : return _dot_ide();
        case "👥" : return _help();
        }
        function _run() {
            btn.title = "🏍️ Run Script";
        }
        function _zoom() {
            btn.title = "💠 Zoom Editor";
        } 
        function _bgnd() {
            btn.title = "🧼 Erase Background";
        }
        function _notes() {
            btn.title = "🗒️ Palette Analyzer Notes";
        }
        function _help() {
            btn.title = "👥 Inspect Globals";
        }
        function _jax() {
            btn.title = "📟 Math Jax Editor";
        }
        function _dot_ide() {
            btn.title = "🚀 Dorothy's Rockets";
        }
        function _home() {
            btn.title = "🏠 View in Browser";
        }
        console.warn( `Ignoring Button:`, k );
    }
    m.forEach( init );
};

</script>

<script id="session.js">

function get_session() {
    const db = sessionStorage;
    if ( null === db ) {
        alert( "Session Store is Unavailable" );
    }
    return ( db );
}

function tsave( key ) {
    const db = get_session();
    if (! db ) { return; }
    const ed = gid( "sce" );
    key = ( str( key ) || str( ed.sessionkey ) );
    if (! key ) {
        key = input_key( "Session Key" );
        if (! key ) { return; }
    }
    ed.sessionkey = ( key );
    const value = ( ed.value );
    db.setItem( key, value );
    console.log( `Wrote "${key}" to Session Store` );
}

function tload( key ) {
    const db = get_session();
    if (! db ) { return; }
    const ed = gid( "sce" );
    key = ( str( key ) || str( ed.sessionkey ) );
    if (! key ) {
        key = input_key( "Session Key" );
        if (! key ) { return; }
    }
    const value = db.getItem( key );
    if ( null === value ) {
        console.warn( "Missing Session Key:", key );
        return;
    }
    ed.sessionkey =( key );
    ed.value = ( value );
    ed.focus();
    console.log( `Read "${key}" from Session Store` );
}

function tlist( rex ) {
    const m = tlist.members( rex );
    if (! m ) { return; }
    const ed = gid( "sce" );
    ed.sessionkey = ( "session-key.list" );
    ed.value = m.join( "\n" );
    console.log( `Read Keys from Session Store` );
}

tlist.members = function( rex ) {
    const db = get_session();
    if (! db ) { return; }
    let m = mem( db );
    if ( rex = str( rex ) ) {
        rex = new RegExp( rex );
        m = m.filter( k => ( rex.test( k ) ) );
    }
    return ( m );
};

tlist.inspect = function( key ) {
    const db = sessionStorage;
    if ( null === db ) { return; }
    const c = console;
    if ( key = str( key ) ) {
        c.group( "Session Entry" );
        c.log( "Key:", key );
        c.log( "Value:", db.getItem( key ) );
        c.groupEnd();
    } else {
        c.group( "Session Keys" );
        c.table( mem( db ) );
        c.groupEnd();
    }
};

</script>
