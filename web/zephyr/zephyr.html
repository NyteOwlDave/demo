<script>
function koffee( event ) {
    const kc = event.keyCode;
    if ( modkey( kc ) ) { return; }
    const km = modkeys( event );
    if ( km === modkeys.ALT ) {
        if ( kc === 13 ) {
            claim( event );
            exec( sce.value );
            return;
        }
        return;
    }
    if ( km === 0 ) {
        if ( kc === 9 ) {
            claim( event );
            if ( "function" !== typeof sce.insert ) {
                init_editor( sce );
            }
            sce.insert( "\t" );
            return;
        }
        return;
    }
}
</script>

<script>
addEventListener( "keydown", koffee );
</script>

<script>
function claim( event ) {
    event.stopPropagation();
    event.preventDefault();
}
</script>

<script>
function modkey( code ) {
    if ( code instanceof Event ) {
        code = code.keyCode;
    }
    return modkey.codes.includes( code );
}
modkey.codes = [ 16, 17, 18, 92, 93 ];
</script>

<script>
function modkeys( event ) {
    const _K = modkeys;
    const _A = event.altKey   ? _K.ALT   : 0;
    const _C = event.ctrlKey  ? _K.CTRL  : 0;
    const _M = event.metaKey  ? _K.META  : 0;
    const _S = event.shiftKey ? _K.SHIFT : 0;
    return ( _A | _C | _M | _S );
}
</script>

<script>
modkeys.ALT   = 0x01;
modkeys.CTRL  = 0x02;
modkeys.META  = 0x04;
modkeys.SHIFT = 0x08;
modkeys.ZERO  = 0x00;
modkeys.MASK  = 0x0F;
</script>

<script>
function exec( js ) {
    try {
        exec.gems.add( js );
        exec.output = window.eval( js );
        exec.error  = "";
    } catch ( e ) {
        console.error ( e );
        exec.error  = ( e.message );
        exec.output = "";
    }
}
;
; exec.gems = ( new Set() )
;
</script>

};
</script>

<script>
function color( fg, bg, o ) {
    o = ( o || document.body );
    const st = o.style;
    if ( "string" === typeof fg ) {

    }
    if ( "string" === typeof bg ) {
        st.backgroundColor = ( bg );
    }
}

};

<script>
function init_editor( ed ) {
    ed = ( ed || sce );
    ed.resume = function() {
        ed.value = stashed_scripts;
    };
    ed.insert = function ( t ) {
        insert_text( ed, t );
    };
}
</script>

<script>
function insert_text( ed, t ) {
    const n = t.length;
    const o = ed.value;
    const s = ed.selectionStart;
    ed.value = [
        o.slice( 0, s )
      , o.slice( ed.selectionEnd )
    ].join( t );
    ed.selectionStart = (
        ed.selectionEnd = ( s + n )
    );
    ed.focus();
}
</script>
