<script id="odd-number-series.js">

function find_odd_series( base ) {
   answer = pow( base, 3 );
   const attempt =( n )=> {
      let sum = 0;
      for ( let i = 0; i < base; i += 1 ) {
          sum += n; n += 2;
          if ( sum > answer ) {
              return ( 1 );
          }
      }
      return sgn( sum - answer );
   }
   let n = 1;
   let limit = 10000;
   let result;
   while ( limit-- > 0 ) {
      result = attempt( n );
      if ( result === 0 ) { break; }
      if ( result >   0 ) {
         throw new Error( "Exceeded Depth Limit" );
      }
      n += 2;
   }
   const values = [];
   for ( let i=0; i<base; i +=1 ) {
       values.push( n );
       n += 2;
   }
   let rhs = values.join( " + " );
   let lhs = ( `cube( ${base} )` );
   let sum = values.reduce( (a,b)=>(a+b), 0 );
   return [ lhs, rhs, sum ].join( " = " );
}

test_series = function( a=1, b=6 ) {
    const lines = [];
    while ( a <= b ) {
       let s = find_odd_series( a );
       lines.push( s );
       a += 1;
   }
   return ( lines.join( "\n" ) );
};

;
; ( 0 ) && report( test_series( 1, 9 ) )
; ( 0 ) && report( "OK!" )
